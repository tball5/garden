<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Garden</title>
<meta name="description" content="Wander through a night valley of flowers that grows as you move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--u:min(calc(100vw/1600),calc(100vh/900));--cream:#f5efe2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{color:var(--cream);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:none}
body.nogl{background:radial-gradient(120% 80% at 50% 100%,#0d2a26 0%,#05100f 45%,#000 80%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#valley{position:fixed;inset:0}
html{cursor:grab}html.dragging{cursor:grabbing}
.js-canvas-container{position:absolute;inset:0}
.js-canvas-container canvas{display:block;width:100%!important;height:100%!important}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.ui.on{opacity:1}
.ui a,.ui button{pointer-events:auto}
header{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0);display:flex;align-items:center;justify-content:space-between;padding:calc(24*var(--u)) calc(44*var(--u)) 0}
.logo{font-size:calc(26*var(--u));font-weight:500;letter-spacing:-.02em}
nav{display:flex;align-items:center;gap:calc(44*var(--u));font-size:calc(14.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
nav a:not(.pill){transition:opacity .2s}nav a:not(.pill):hover{opacity:.6}
.pill{display:inline-flex;align-items:center;height:calc(46*var(--u));padding:0 calc(26*var(--u));border-radius:99px;background:var(--cream);color:#151510;transition:transform .25s}
.pill:hover{transform:translateY(-1px)}
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font:400 calc(158*var(--u))/.92 Antonio,"Arial Narrow",sans-serif;letter-spacing:-.012em;white-space:nowrap;text-shadow:0 0 40px rgba(0,0,0,.35)}
.steps{display:flex;gap:calc(16*var(--u));margin-bottom:calc(18*var(--u))}
.step{display:grid;place-items:center;width:calc(46*var(--u));height:calc(46*var(--u));border-radius:50%;border:1.5px solid rgba(245,239,226,.55);background:rgba(0,0,0,.18);transition:background .25s,color .25s,border-color .25s,transform .15s}
.step:hover{border-color:var(--cream)}
.step.held,.step:active{background:var(--cream);color:#151510;border-color:var(--cream);transform:scale(.94)}
.step svg{width:calc(18*var(--u));height:calc(18*var(--u));fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ui button,.ui a{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.dot{width:calc(10*var(--u));height:calc(10*var(--u));min-width:7px;min-height:7px;border-radius:50%;background:currentColor;transition:transform .3s}
.go:hover .dot{transform:scale(1.25)}
.hint-touch{display:none}
@media (hover:none) and (pointer:coarse){.hint-desk{display:none}.hint-touch{display:inline}}
.go{display:grid;place-items:center;width:calc(58*var(--u));height:calc(58*var(--u));border:1.5px solid var(--cream);border-radius:50%;transition:background .3s,color .3s}
.go:hover{background:var(--cream);color:#151510}
.corner{position:absolute;right:calc(44*var(--u));bottom:calc(44*var(--u));display:flex;align-items:center;gap:calc(18*var(--u));font-size:calc(12.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.corner i{width:1px;height:calc(26*var(--u));background:rgba(245,239,226,.45)}
.sound{display:grid;place-items:center;width:calc(28*var(--u));height:calc(28*var(--u))}
.sound svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sound .w,.sound .x{transition:opacity .3s}
.sound[aria-pressed=false] .w{opacity:0}
.sound[aria-pressed=true] .x{opacity:0}
.loader{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#000;transition:opacity 1s ease;pointer-events:none}
.loader.gone{opacity:0}
.loader span{width:calc(9*var(--u));height:calc(9*var(--u));min-width:6px;min-height:6px;border-radius:50%;background:var(--cream);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.4);opacity:.4}}
a:focus-visible,button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
@media (max-width:820px){
  :root{--u:1px}
  header{padding:18px 18px 0}
  nav a:not(.pill){display:none}
  .pill{height:40px;padding:0 18px;font-size:12px}
  .hero{left:20px;right:20px}
  h1{font-size:clamp(64px,19vw,96px);white-space:normal}
  .corner{left:20px;right:20px;bottom:calc(26px + env(safe-area-inset-bottom));justify-content:center;font-size:11px}
  .hero{top:auto;bottom:calc(84px + env(safe-area-inset-bottom));transform:none}
  .steps{gap:22px;margin-bottom:16px}
  .step{width:52px;height:52px}.step svg{width:20px;height:20px}
  .go{width:58px;height:58px}
  .sound{width:30px;height:30px}
}
@media (prefers-reduced-motion:reduce){.loader span{animation:none}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="valley" aria-hidden="true"><div class="js-canvas-container" id="stage"></div></div>
<div class="ui" id="ui">
  <header>
    <a class="logo" href="#" aria-label="The Garden">The Garden</a>
  </header>
  <section class="hero">
    <div class="steps">
      <button class="step" id="back" aria-label="Walk back"><svg viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button>
      <button class="step" id="fwd" aria-label="Walk forward"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button>
    </div>
    <a class="go" href="#" id="go" aria-label="Pause and scatter the flowers"><span class="dot"></span></a>
  </section>
  <div class="corner"><span class="hint-desk">Scroll to wander</span><span class="hint-touch">Drag to look around</span><i></i>
    <button class="sound" id="sound" aria-pressed="false" aria-label="Ambient sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="m16 10 4 4m0-4-4 4"/></svg></button>
  </div>
</div>
<div class="loader" id="loader"><span></span></div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const $=id=>document.getElementById(id);
const loaderEl=$('loader'), uiEl=$('ui'), stage=$('stage');
const SMALL=matchMedia('(max-width:820px)').matches || matchMedia('(pointer:coarse)').matches;
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------ audio
   Procedural ambient night: a slow pad, wind, distant chimes and crickets,
   all through one low-pass filter that the arrow button closes down.     */
const audio={ctx:null,on:false,master:null,lp:null,
  init(){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    const ctx=this.ctx=new AC();
    const master=this.master=ctx.createGain(); master.gain.value=0;
    const lp=this.lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=16000; lp.Q.value=.6;
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3;
    master.connect(lp); lp.connect(comp); comp.connect(ctx.destination);
    // reverb from a generated impulse
    const conv=ctx.createConvolver(), len=ctx.sampleRate*4.5, ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}
    conv.buffer=ir; const wet=ctx.createGain(); wet.gain.value=.6; conv.connect(wet); wet.connect(master);
    this.rev=conv;
    // pad
    const padLp=ctx.createBiquadFilter(); padLp.type='lowpass'; padLp.frequency.value=900;
    const padBus=ctx.createGain(); padBus.gain.value=.55; padLp.connect(padBus); padBus.connect(master); padBus.connect(conv);
    [73.42,110,146.83,164.81,220,277.18,329.63].forEach((f,i)=>{
      const g=ctx.createGain(); g.gain.value=.035; g.connect(padLp);
      const lfo=ctx.createOscillator(), lg=ctx.createGain(); lfo.frequency.value=.04+i*.017; lg.gain.value=.028;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      [-5,5].forEach((dt,k)=>{const o=ctx.createOscillator(); o.type=k?'triangle':'sine'; o.frequency.value=f; o.detune.value=dt; o.connect(g); o.start()});
    });
    // wind
    const nb=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate), nd=nb.getChannelData(0);
    for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    const ns=ctx.createBufferSource(); ns.buffer=nb; ns.loop=true;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=.7;
    const wl=ctx.createOscillator(), wlg=ctx.createGain(); wl.frequency.value=.06; wlg.gain.value=320; wl.connect(wlg); wlg.connect(bp.frequency); wl.start();
    const wg=ctx.createGain(); wg.gain.value=.05; ns.connect(bp); bp.connect(wg); wg.connect(master); wg.connect(conv); ns.start();
    this.chimes(); this.crickets();
    return true;
  },
  chimes(){
    const ctx=this.ctx, notes=[587.33,659.25,739.99,880,987.77,1174.66,1318.51];
    const ring=()=>{
      if(this.on){
        const t=ctx.currentTime, f=notes[Math.random()*notes.length|0];
        const pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
        const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.045,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+3.8);
        [[1,1],[2.76,.25],[5.4,.08]].forEach(([m,v])=>{const o=ctx.createOscillator(),og=ctx.createGain();o.frequency.value=f*m;og.gain.value=v;o.connect(og);og.connect(g);o.start(t);o.stop(t+4)});
        if(pan){pan.pan.value=Math.random()*1.6-.8; g.connect(pan); pan.connect(this.rev); pan.connect(this.master)} else {g.connect(this.rev)}
      }
      setTimeout(ring,1800+Math.random()*4200);
    }; setTimeout(ring,2500);
  },
  crickets(){
    const ctx=this.ctx;
    const chirp=()=>{
      if(this.on){
        const t=ctx.currentTime, pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
        const o=ctx.createOscillator(); o.frequency.value=4300+Math.random()*500;
        const g=ctx.createGain(); g.gain.value=0;
        for(let k=0,n=3+(Math.random()*3|0);k<n;k++){const s=t+k*.11;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.006,s+.012);g.gain.linearRampToValueAtTime(0,s+.05)}
        o.connect(g); if(pan){pan.pan.value=Math.random()*2-1;g.connect(pan);pan.connect(this.master);pan.connect(this.rev)}else g.connect(this.master);
        o.start(t); o.stop(t+.8);
      }
      setTimeout(chirp,900+Math.random()*3000);
    }; setTimeout(chirp,1500);
  },
  toggle(){
    if(!this.ctx && !this.init()) return this.on;
    this.ctx.resume&&this.ctx.resume().catch(()=>{});
    this.on=!this.on;
    const t=this.ctx.currentTime, g=this.master.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.setTargetAtTime(this.on?.75:0,t,this.on?.9:.35);
    return this.on;
  },
  muffle(m){ if(!this.ctx) return; const t=this.ctx.currentTime; this.lp.frequency.cancelScheduledValues(t); this.lp.frequency.setTargetAtTime(m?380:16000,t,m?.4:.6) }
};
const soundBtn=$('sound');
soundBtn.addEventListener('click',()=>{ soundBtn.setAttribute('aria-pressed',String(audio.toggle())) });

/* --------------------------------------------------------------- noise */
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5}return s}

/* ----------------------------------------------------- valley geometry
   A winding valley loop. The camera follows its floor forever.        */
const ringR=a=>230+34*Math.sin(3*a+.4)+16*Math.sin(5*a+1.3)+7*Math.sin(9*a+2.1);
function ground(x,z){
  const a=Math.atan2(z,x), d=Math.abs(Math.hypot(x,z)-ringR(a));
  const w=15+9*vnoise(a*7+3,.5), t=Math.max(0,d-w);
  // hills rise from the valley floor and level off at a ridgeline whose height wanders, leaving saddles between peaks
  const raw=Math.pow(t/36,1.55)*15, cap=24+110*Math.pow(fbm(x*.0075+40,z*.0075-12),1.8);
  return cap*(1-Math.exp(-raw/cap)) + (fbm(x*.012+7,z*.012-3)-.5)*7 + fbm(x*.06,z*.06)*1.4;
}

function boot(){
  let renderer;
  try{
    renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
    if(!renderer.getContext()) throw 0;
  }catch(e){ document.body.classList.add('nogl'); loaderEl.classList.add('gone'); uiEl.classList.add('on'); return }
  const DPR=Math.min(devicePixelRatio||1,SMALL?1.35:1.75);
  renderer.setPixelRatio(DPR); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0x000000,1);
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
  stage.appendChild(renderer.domElement);

  const scene=new THREE.Scene();
  const FOG=new THREE.Color('#03070a');
  scene.fog=new THREE.FogExp2(FOG,.0105);
  const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,2200);

  // camera path, sampled into a table with smoothed floor heights
  const ctrl=[]; for(let i=0;i<160;i++){const a=i/160*Math.PI*2,r=ringR(a);ctrl.push(new THREE.Vector3(r*Math.cos(a),0,r*Math.sin(a)))}
  const curve=new THREE.CatmullRomCurve3(ctrl,true,'centripetal');
  const L=curve.getLength(), NS=3000, PX=new Float32Array(NS), PZ=new Float32Array(NS), PY=new Float32Array(NS);
  const raw=new Float32Array(NS), tmp=new THREE.Vector3();
  for(let i=0;i<NS;i++){curve.getPointAt(i/NS,tmp);PX[i]=tmp.x;PZ[i]=tmp.z;raw[i]=ground(tmp.x,tmp.z)}
  for(let i=0;i<NS;i++){let s=0,n=0;for(let k=-40;k<=40;k++){s+=raw[(i+k+NS)%NS];n++}PY[i]=Math.max(s/n,raw[i]-.4)}
  function pathAt(s,out){
    const f=((s%L)+L)%L/L*NS, i=Math.floor(f), j=(i+1)%NS, t=f-i;
    return out.set(PX[i]+(PX[j]-PX[i])*t, PY[i]+(PY[j]-PY[i])*t, PZ[i]+(PZ[j]-PZ[i])*t);
  }

  /* terrain */
  const TG=new THREE.PlaneGeometry(820,820,SMALL?200:300,SMALL?200:300); TG.rotateX(-Math.PI/2);
  const tp=TG.attributes.position, tcol=new Float32Array(tp.count*3);
  const cLow=new THREE.Color('#0b1a16'), cHigh=new THREE.Color('#0a1118'), cc=new THREE.Color();
  for(let i=0;i<tp.count;i++){const x=tp.getX(i),z=tp.getZ(i),y=ground(x,z);tp.setY(i,y);
    cc.copy(cLow).lerp(cHigh,Math.min(1,Math.max(0,y/30))).multiplyScalar(.75+.5*vnoise(x*.08,z*.08));tcol.set([cc.r,cc.g,cc.b],i*3)}
  TG.setAttribute('color',new THREE.BufferAttribute(tcol,3)); TG.computeVertexNormals();
  scene.add(new THREE.Mesh(TG,new THREE.MeshLambertMaterial({vertexColors:true})));
  scene.add(new THREE.HemisphereLight(0x3a5a78,0x050806,.7));
  const moonLight=new THREE.DirectionalLight(0x9fb8d8,.9); moonLight.position.set(-.4,1,.2); scene.add(moonLight);

  /* sky + stars */
  const sky=new THREE.Mesh(new THREE.SphereGeometry(1900,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
    vertexShader:`varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 vP;void main(){float h=clamp(vP.y,0.,1.);vec3 c=mix(vec3(.018,.04,.055),vec3(0.),pow(h,.45));gl_FragColor=vec4(c,1.);}`}));
  scene.add(sky);
  {const n=2200,p=new Float32Array(n*3),s=new Float32Array(n);
    for(let i=0;i<n;i++){const u=Math.random()*Math.PI*2,v=.06+Math.random()*.94,r=1800,q=Math.sqrt(1-v*v);p.set([r*q*Math.cos(u),r*v,r*q*Math.sin(u)],i*3);s[i]=Math.random()}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('aS',new THREE.BufferAttribute(s,1));
    const stars=new THREE.Points(g,new THREE.ShaderMaterial({transparent:true,depthWrite:false,fog:false,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0},uPR:{value:DPR}},
      vertexShader:`attribute float aS;uniform float uTime,uPR;varying float vA;void main(){vA=(.25+.75*aS)*(.6+.4*sin(uTime*(.5+aS*2.)+aS*90.));gl_PointSize=(1.+aS*1.6)*uPR;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader:`varying float vA;void main(){float r=length(gl_PointCoord-.5);gl_FragColor=vec4(vec3(.85,.9,1.),(1.-smoothstep(.1,.5,r))*vA*.8);}`}));
    stars.frustumCulled=false; scene.add(stars); scene.userData.stars=stars}

  const U_TIME={value:0};
  /* moon: dim, behind slow drifting clouds, fixed in the sky */
  const moon=new THREE.Mesh(new THREE.PlaneGeometry(420,420),new THREE.ShaderMaterial({transparent:true,depthWrite:false,fog:false,blending:THREE.AdditiveBlending,
    uniforms:{uTime:U_TIME},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform float uTime;varying vec2 vUv;
      float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
      void main(){
        vec2 q=(vUv*2.-1.)/.2;float r=length(q);
        float disc=1.-smoothstep(.96,1.,r);
        float m=n(q*2.6+3.)*.55+n(q*6.+9.)*.3+n(q*14.)*.15;
        float limb=sqrt(max(0.,1.-r*r));
        vec3 moonCol=vec3(.9,.9,1.)*(.55+.45*limb)*(1.-smoothstep(.42,.7,m)*.38);
        // drifting cloud bank in front of the moon
        float t=uTime;
        float c=fbm(q*vec2(.32,.8)+vec2(t*.035,t*.006));
        c=smoothstep(.26,.66,c+fbm(q*vec2(.8,1.6)-vec2(t*.05,0.))*.25-.08);
        float through=1.-c*.9;
        float halo=exp(-max(r-1.,0.)*1.6)*(1.-disc);
        float lit=exp(-r*.55);
        float edge=1.-smoothstep(3.2,4.9,r);
        vec3 col=moonCol*disc*.2*through
                +vec3(.5,.52,.8)*halo*.07*through
                +vec3(.6,.6,.78)*c*lit*.12;
        gl_FragColor=vec4(col*edge,1.);
      }`}));
  moon.frustumCulled=false; moon.renderOrder=-1; scene.add(moon);
  // fixed point in the sky, set into the deepest dip between the hills seen from the start of the walk
  const moonDir=(()=>{
    const a=pathAt(10,new THREE.Vector3()), b=pathAt(24,new THREE.Vector3()), eye=a.y+2.5;
    const f=new THREE.Vector3(b.x-a.x,0,b.z-a.z).normalize(), rt=f.clone().cross(new THREE.Vector3(0,1,0));
    const deg=Math.PI/180, H=[], AZ=[];

    const it=Math.min(1,(time-t0)/INTRO), ie=ease(it);
    hover+=(hoverT-hover)*(1-Math.exp(-dt*(hoverT?1.4:1.8)));
    // idle forward drift, eased to a stop while hovering the arrow
    target+=dt*(REDUCE?.5:1.5)*(1-hover)*ie + walk*dt*16;
    if(hover>.01) target+=(cur-target)*(1-Math.exp(-dt*3*hover));
    cur+=(target-cur)*(1-Math.exp(-dt*2.4));
    const v=Math.abs(cur-prev)/Math.max(dt,1e-4); prev=cur;
    speed+=(Math.min(1,v/30)-speed)*(1-Math.exp(-dt*3));
    mouseS.lerp(mouseT,1-Math.exp(-dt*4));
    U.uMouseOn.value+=(mouseOnT-U.uMouseOn.value)*(1-Math.exp(-dt*3));
    U.uMouse.value.copy(mouseS);

    const s=cur-(1-ie)*45;
    pathAt(s,cp); pathAt(s+14,lp);
    right.set(lp.x-cp.x,0,lp.z-cp.z).normalize().cross(up);
    camera.position.set(cp.x,cp.y+2.5+(1-ie)*34+Math.sin(time*.5)*.08,cp.z);
    la.copy(lp).addScaledVector(up,1.4-(1-ie)*6+mouseS.y*1.8).addScaledVector(right,mouseS.x*3.2);
    camera.lookAt(la);
    if(!drag&&(vYaw||vPitch)){                       // glide after a flick, easing to a stop
      yawT+=vYaw*dt; pitchT=Math.max(-.75,Math.min(1.05,pitchT+vPitch*dt));
      const f=Math.exp(-dt*3.2); vYaw*=f; vPitch*=f; if(Math.abs(vYaw)+Math.abs(vPitch)<.01) vYaw=vPitch=0;
    }
    const lookRate=drag?14:8;
    yaw+=(yawT-yaw)*(1-Math.exp(-dt*lookRate)); pitch+=(pitchT-pitch)*(1-Math.exp(-dt*lookRate));
    camera.rotateOnWorldAxis(up,yaw); camera.rotateX(pitch);
    camera.rotateZ(-mouseS.x*.025);
    wanderer.rotation.y=Math.atan2(camera.position.x-wanderer.position.x,camera.position.z-wanderer.position.z);
    wanderer.userData.glow.material.opacity=.85+.15*Math.sin(time*2.3)*Math.sin(time*1.7+1.);

    U.uTime.value=time; U_TIME.value=time; U.uIntro.value=it; U.uDisperse.value=hover*hover*(3-2*hover); U.uCam.value.copy(camera.position);
    scene.userData.stars.material.uniforms.uTime.value=time;
    sky.position.copy(camera.position); scene.userData.stars.position.copy(camera.position);
    moon.position.copy(camera.position).addScaledVector(moonDir,1500); moon.lookAt(camera.position);
    const rayInt=ie*(1-hover*.6);
    for(const r of rays){r.rotation.set(0,Math.atan2(camera.position.x-r.position.x,camera.position.z-r.position.z),r.userData.tilt);r.material.uniforms.uInt.value=rayInt}
    fx.uniforms.uTime.value=time; fx.uniforms.uSpeed.value=speed;
    bloom.strength=.75+hover*.4;

    { const b=wanderer.userData.body, m=b.material; blackout.map=m.map; blackout.needsUpdate=blackout.userData.map!==m.map; blackout.userData.map=m.map;
      b.material=blackout; bloomComposer.render(); b.material=m; }
    composer.render();
    if(first){first=false;requestAnimationFrame(()=>loaderEl.classList.add('gone'))}
    if(!introDone&&it>=.92){introDone=true;uiEl.classList.add('on')}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
// let the loader paint before the valley is built
requestAnimationFrame(()=>setTimeout(boot,30));
</script>
